plugins { id 'java' }
group = 'net.runelite.client.plugins.microbot'
version = '1.0.25'
repositories {
    mavenCentral()
    ivy {
        url = uri('https://github.com/chsami/Microbot/releases/download')
        patternLayout { artifact '[revision]/microbot-[revision].[ext]' }
        metadataSources { artifact() }
    }
}
def clientPath = findProperty('microbotClientPath') ?: '.tools/microbot-2.6.34.jar'
dependencies {
    if (file(clientPath).exists()) {
        compileOnly files(clientPath)
        testImplementation files(clientPath)
    } else {
        compileOnly 'com.microbot:microbot:2.6.34@jar'
        testImplementation 'com.microbot:microbot:2.6.34@jar'
    }
    compileOnly 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
java { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 11 }
test { useJUnitPlatform(); systemProperty 'java.awt.headless', 'true' }
jar {
    archiveFileName = 'HighLevelAlchemyPlugin.jar'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes('Plugin-Class': 'net.runelite.client.plugins.microbot.highlevelalchemy.HighLevelAlchemyPlugin',
            'Implementation-Version': project.version)
    }
}
